[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "the-versifier"
version = "1.0.0"
description = "Il Versificatore: an electronic poetry machine chatbot inspired by Primo Levi"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest"]

[project.scripts]
versifier = "versifier.cli:main"

[tool.setuptools]
packages = ["versifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
